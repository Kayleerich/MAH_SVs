cluster:
  sbatch
    --cpus-per-task={threads}
    --mem={resources.mem_mb}
    --job-name=smk-{rule}-{wildcards}
    --output=~/MAH_test/logs/{rule}-{wildcards}-%j
    --error=~/MAH_test/logs/{rule}-{wildcards}-.%j.err
    --nodes=1
    --time={resources.runtime}
default-resources:
  - qos=normal
  - runtime="18000"
  - cpus_per_task=1
  - mem_mb=50000
restart-times: 3
max-jobs-per-second: 1
max-status-checks-per-second: 1
local-cores: 1
latency-wait: 1800
jobs: 5
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
